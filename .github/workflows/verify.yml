name: Verify

on:
  # Every PR base is covered, so sub-PRs into an integration branch such as
  # addon/foo are verified too, not just PRs aimed at main.
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      # Playwright stays a local pre-PR check for now:
      # tests/e2e/views-reorder.spec.ts has a pre-existing card-reorder failure
      # on main. Add `npm run test:e2e` here once that suite is green.
