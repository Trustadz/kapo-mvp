services:
  kapo:
    build:
      context: .
    image: kapo:latest
    container_name: kapo
    restart: unless-stopped
    ports:
      - '${KAPO_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/kapo.db
      UPLOAD_DIR: /app/data/uploads
      KAPO_MIGRATIONS_DIR: /app/migrations
      KAPO_PUBLIC_URL: ${KAPO_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - kapo-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  kapo-data:
