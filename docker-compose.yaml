services:
  kapo:
    image: ghcr.io/trustadz/kapo-mvp:latest
    container_name: kapo
    restart: unless-stopped
    ports:
      # Localhost only: put Caddy/nginx in front for HTTPS. Use "3000:3000"
      # instead if you want direct LAN access.
      - "127.0.0.1:3000:3000"
    environment:
      # Change this to the address people type in the browser.
      KAPO_PUBLIC_URL: https://kapo.example.com
      TZ: Europe/Amsterdam
      # --- PocketID SSO (optional) ---
      # Uncomment and fill in to enable single sign-on. The callback URL in
      # PocketID is https://kapo.example.com/api/auth/pocketid/callback.
      # KAPO_OIDC_ISSUER: https://id.example.com
      # KAPO_OIDC_CLIENT_ID: kapo
      # KAPO_OIDC_CLIENT_SECRET: change-me
      # KAPO_OIDC_PROVIDER_NAME: PocketID
      # KAPO_OIDC_SCOPES: openid profile email
      # Existing accounts match by email; new accounts are Viewers.
      # KAPO_OIDC_AUTO_PROVISION: "1"
      # Copy the PocketID picture when the account has no Kapo avatar yet.
      # KAPO_OIDC_IMPORT_AVATAR: "1"
      # Hide password sign-in only after SSO works; keep a break-glass plan.
      # KAPO_PASSWORD_LOGIN: disabled
      # Recommended with SSO: keeps in-flight sign-ins valid across restarts.
      # SESSION_SECRET: change-me-to-a-long-random-value
    volumes:
      - ./data:/app/data
      - ./upload:/app/upload
      - ./backup:/backup
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
